name: Publish Heme molecular research
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Heme static research page
        run: |
          mkdir -p _site
          unzip -q assets.zip -d _site
          unzip -oq research-assets.zip -d _site
          unzip -oq atomic-replay-assets.zip -d _site
          cp index.html content.js application-data.js application-ui.js figures-data.js molecule-engine.js research-records.js README.md ASSET-MANIFEST.json .nojekyll _site/
          mkdir -p _site/assets/motion
          cp assets/selection-maps.v1.compact.json assets/share-card.jpg assets/source-model-fallback.png _site/assets/
          cp assets/index-68mwwvaQ.css assets/index-SM-FqrIc.js _site/assets/
          cp assets/motion/heme-atomic-replay-manifest.json assets/motion/coordinate-verification.json _site/assets/motion/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Heme research page
        id: deployment
        uses: actions/deploy-pages@v4
