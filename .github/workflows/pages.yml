name: Publish molecular research viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare static research viewer
        run: |
          mkdir -p _site
          cp index.html style.css app.js research-data.js .nojekyll README.md ASSET-MANIFEST.json biosensor-tour.js biosensor-tour.css _site/
          unzip -q assets.zip -d _site
          unzip -oq research-assets.zip -d _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy research viewer
        id: deployment
        uses: actions/deploy-pages@v4
