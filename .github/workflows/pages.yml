name: Publish molecular research viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare static research viewer
        run: |
          mkdir -p _site
          cp story-data.js story-scene.js story-scene.css story-ui.js story-ui.css index.html style.css engine-styles.css content.js application-data.js application-ui.js molecule-engine.js app.js figures-data.js site-config.js README.md .nojekyll ASSET-MANIFEST.json _site/
          unzip -q assets.zip -d _site
          unzip -oq research-assets.zip -d _site
          unzip -oq atomic-replay-assets.zip -d _site
          mkdir -p _site/assets
          cp assets/selection-maps.v1.compact.json _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy research viewer
        id: deployment
        uses: actions/deploy-pages@v4
